<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jugrrnaut Waistcoat Halter Top</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:white;
    padding:20px;
}

.product-card{
    max-width:900px;
    margin:auto;
}

.image-container{
    position:relative;
    width:100%;
    height:520px;
    overflow:hidden;
    background:#f5f4f2;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:40px;
    transition:opacity 0.25s ease;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
    opacity:0.9;
    transition:opacity 0.2s ease;
}

.arrow:hover{
    opacity:0.5;
}

.left{
    left:20px;
}

.right{
    right:20px;
}

</style>
</head>

<body>

<div class="product-card">

    <div class="image-container">

        <span class="arrow left" onclick="prevImage()">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <path d="M15 4 L7 12 L15 20"
                      stroke="#111"
                      stroke-width="2.5"
                      fill="none"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </span>

        <img id="productImage"
     src="Women/Outerwear/jugrrnaut-waistcoat-halter-top/1.png">

        <span class="arrow right" onclick="nextImage()">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <path d="M9 4 L17 12 L9 20"
                      stroke="#111"
                      stroke-width="2.5"
                      fill="none"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </span>

    </div>

</div>

<script>

const images = [
"Women/Outerwear/jugrrnaut-waistcoat-halter-top/1.png",
"Women/Outerwear/jugrrnaut-waistcoat-halter-top/2.png"
];

let current = 0;

function updateImage(){
    const image = document.getElementById("productImage");

    image.style.opacity = "0";

    setTimeout(() => {
        image.src = images[current];
        image.style.opacity = "1";
    }, 150);
}

function nextImage(){
    current = (current + 1) % images.length;
    updateImage();
}

function prevImage(){
    current = (current - 1 + images.length) % images.length;
    updateImage();
}

let touchStartX = 0;
let touchEndX = 0;

const imageContainer = document.querySelector(".image-container");

imageContainer.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
});

imageContainer.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe(){

    const swipeDistance = touchEndX - touchStartX;

    if(Math.abs(swipeDistance) < 50){
        return;
    }

    if(swipeDistance > 0){
        prevImage();
    } else {
        nextImage();
    }
}

</script>

</body>
</html>
