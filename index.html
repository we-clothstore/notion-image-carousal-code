<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Carousel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:white;
    padding:20px;
}

.product-card{
    max-width:900px;
    margin:auto;
}

.image-container{
    position:relative;
    width:100%;
    height:520px;
    overflow:hidden;
    background:#f5f4f2;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:40px;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border:1px solid #111;
    border-radius:50%;
    background:white;
    color:#111;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:none;
}

.arrow:hover{
    transform:translateY(-50%) scale(1.08);
}

.left{
    left:20px;
}

.right{
    right:20px;
}

.details{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.description{
    max-width:75%;
    color:#444;
    line-height:1.6;
}

.price{
    font-size:22px;
    font-weight:bold;
}



</style>
</head>

<body>

<div class="product-card">

    <div class="image-container">

        <button class="arrow left" onclick="prevImage()">❮</button>

        <img id="productImage"
        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1200">

        <button class="arrow right" onclick="nextImage()">❯</button>

    </div>

    
</div>

<script>

const images = [
"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1200",
"https://images.unsplash.com/photo-1603252109303-2751441dd157?w=1200",
"https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=1200",
"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=1200"
];

let current = 0;

function updateImage(){
    document.getElementById("productImage").src = images[current];
    
}

function nextImage(){
    current = (current + 1) % images.length;
    updateImage();
}

function prevImage(){
    current = (current - 1 + images.length) % images.length;
    updateImage();
}

</script>

</body>
</html>
